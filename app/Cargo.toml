[package]
name = "aiom-app"
version = "0.1.0"
edition = "2021"
description = "Desktop app for aiom, the All-in-One account manager for AI coding CLIs"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aiom = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
